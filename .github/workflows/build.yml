name: build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm

            # `npm ci` respects the lockfile exactly. The ADB transport layer is
            # deliberately pinned to exact versions; an unnoticed minor bump
            # there can silently change acquisition behaviour.
            - run: npm ci

            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            - uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: web/dist
